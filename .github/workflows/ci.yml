name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # requirements.txt is deliberately NOT installed here: it pulls torch,
        # streamlit, faster-whisper, google-generativeai and the pinned
        # opencv-python wheel, which are heavy and irrelevant to schema
        # validation and mock runs. This is the minimal set that lets
        # `src.flow` and `src.devices` import on a headless runner.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pydantic \
            python-dotenv \
            pyyaml \
            pytest \
            numpy \
            pandas \
            matplotlib \
            pyserial \
            pydobot \
            bleak \
            opencv-python-headless \
            fastapi \
            uvicorn \
            httpx \
            python-multipart \
            zeroconf

      - name: Byte-compile all Python sources
        run: |
          find src detection examples -name '*.py' -print0 \
            | xargs -0 python -m py_compile

      - name: Run unit tests
        run: python -m pytest tests/ src/monitoring/tests/ src/imaging/tests/ -q

      - name: Validate example flows against the schema
        run: |
          for f in examples/zif8/*.json examples/microscope/*.json examples/maxarm/*.json examples/keithley2002/*.json examples/li5640/*.json examples/dso1000/*.json; do
            echo "::group::$f"
            python -m src.flow.run_flow "$f" --validate-only
            echo "::endgroup::"
          done

      - name: Dry-run an example flow without hardware
        run: |
          python -m src.flow.run_flow \
            examples/zif8/zif8_two_solution_mixing_speed5.json --mock
          python -m src.flow.run_flow examples/maxarm/pick_and_place.json --mock
          python -m src.flow.run_flow examples/keithley2002/measure_dc_voltage.json --mock
          python -m src.flow.run_flow examples/li5640/read_lockin.json --mock
          python -m src.flow.run_flow examples/dso1000/read_scope.json --mock

      - name: LI5640 oscillator example (refused by default, runs with an enabling config)
        run: |
          # writing the oscillator is disabled by default: the preflight refuses (exit 3)
          set +e
          python -m src.flow.run_flow examples/li5640/oscillator/osc_sweep_scope.json --validate-only
          code=$?
          set -e
          test "$code" -eq 3
          # a lab config that allows 0.3 Vrms between 10 Hz and 1 kHz (CI only)
          printf 'shared_devices:\n  lockin_osc_max_vrms: 0.3\n  lockin_osc_min_hz: 10.0\n  lockin_osc_max_hz: 1000.0\n' > config.yaml
          python -m src.flow.run_flow examples/li5640/oscillator/osc_sweep_scope.json --validate-only
          python -m src.flow.run_flow examples/li5640/oscillator/osc_sweep_scope.json --mock
          rm config.yaml

      - name: Recompute the dispensing-stability statistics
        run: python examples/dispensing_stability/stats.py
