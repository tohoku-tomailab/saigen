# ===================================================================
# Environment-dependent settings for the control core (single source).
#
# Copy this file to config.yaml in the repository root and edit it for
# your own setup; config.yaml is gitignored. If config.yaml is absent
# this example file is used, and if it is absent too the built-in
# DEFAULTS in src/config.py apply (which hold the same values).
#
# Sensor-dashboard ports and the video-recording camera index live in
# src/monitoring/config.yaml (see src/monitoring/config.example.yaml);
# src.config re-exports them so there is still only one source per value.
# ===================================================================

# Connection ports per robot (key = robot_id).
# Windows uses COM ports; on Linux/macOS use /dev/tty* paths instead.
# A robot without a picus2_address entry has no electronic pipette.
robots:
  1:
    dobot_port: COM3
    picus2_address: COM4
  2:
    dobot_port: COM5
    picus2_address: COM6
  3:
    dobot_port: COM7      # Robot 3 has no pipette
  # Optional Hiwonder MaxArm (suction pick-and-place, no pipette); see the
  # "MaxArm (Hiwonder) robot" section of docs/setup.md. Robots without a
  # "type" are Dobot Magicians. Only robots a flow uses are opened, so this
  # entry is harmless without the hardware; a real run that uses robot 4
  # refuses to start until maxarm_port is set (or --robot4-maxarm /
  # ROBOT4_MAXARM_PORT is given).
  4:
    type: maxarm
    maxarm_port: ""       # e.g. COM11 on Windows, /dev/ttyUSB0 on Linux (CH340)
    # The MaxArm's own frame (mm, origin on the base yaw axis, z = 0 base
    # plane, the arm faces -y at home). This per-robot box replaces the
    # global workspace keys below for robot 4 only. The values are a
    # conservative starting box INSIDE the arm's reach, NOT a measured cell:
    # measure your own and tighten them before any real run.
    # r_min / r_max bound the horizontal radius hypot(x, y).
    # Required for a MaxArm: x/y/z min and max (r_min / r_max optional).
    # Nothing is inherited from the global Dobot box; a missing key or a
    # key without a value (e.g. "z_min:") refuses to start (ConfigError).
    workspace:
      x_min: -250.0
      x_max: 250.0
      y_min: -280.0
      y_max: -60.0
      z_min: 40.0
      z_max: 225.0
      r_min: 60.0
      r_max: 260.0
    move_ms: 1500         # duration of one move_xyz (100..30000 ms)
    # home_position: [0.0, -160.0, 180.0]   # recommended go_home target (MaxArm frame);
    #   kept as configured (not replaced by the start pose) and must lie inside
    #   the workspace above AND be reachable by the arm's own inverse kinematics,
    #   or the session refuses to start. Without it the start pose becomes home,
    #   and the pose the arm rests in after Hiwonder's factory homing (z ~ 222)
    #   is one the arm cannot be commanded back to, so go_home would be refused.

# Devices shared by all robots.
shared_devices:
  scale_port: COM8        # BCE8221 balance
  camera_index: 0         # webcam used by capture_and_save
  microscope_index: 2     # USB digital microscope (UVC, e.g. 400-CAM106) used by capture_microscope
  microscope_port: ""     # its control serial port (CP210x, e.g. COM10) for microscope_led; "" = no LED control
  microscope_resolution: "3840x2160"   # capture size; 4K is the sharpest and fastest mode (0.4-2 MB per JPEG). Use "1280x720" to keep data small
  dmm_resource: ""        # Keithley 2002 DMM (GPIB) for measure_dmm: VISA resource such as GPIB0::16::INSTR (16 = factory address); "" = no DMM
  dmm_timeout_ms: 10000   # upper limit of one DMM read; raise it for NPLC 50 with autorange or AC
  wait_after_dmm: 0.0     # seconds to wait after each measure_dmm step before the next step
  lockin_resource: ""     # NF LI5640 lock-in amplifier (GPIB, read-only) for measure_lockin: VISA resource such as GPIB0::<address>::INSTR; its address must differ from every other instrument on the bus; "" = no lock-in
  lockin_timeout_ms: 5000 # upper limit of one LI5640 read or write
  wait_after_lockin: 0.0  # seconds to wait AFTER each measure_lockin step (not a settling time before it)
  lockin_osc_max_vrms: 0.0      # LI5640 internal oscillator: largest amplitude (Vrms) set_lockin_oscillator may set; 0 = writing disabled. Choose it for what is wired to OSC OUT (it stays applied until the run releases the LI5640)
  lockin_osc_min_hz: 0.0005     # lowest frequency set_lockin_oscillator may set
  lockin_osc_max_hz: 105000.0   # highest frequency set_lockin_oscillator may set
  scope_resource: ""      # Agilent 1000 series oscilloscope (DSO1014A etc., USB, read-only) for measure_scope: VISA resource such as USB0::0x0957::<product id>::<serial>::INSTR; "" = no scope
  scope_timeout_ms: 5000  # upper limit of one oscilloscope read or write
  wait_after_scope: 0.0   # seconds to wait AFTER each measure_scope step

# Dobot workspace limits. WorkspaceValidator checks every move against
# these BEFORE the robot is commanded, for all robots (except where a
# robot has its own "workspace" above) and in mock mode.
# The values below are the Dobot Magician specification envelope, NOT a
# safety-tuned cell. The setup used for the paper ran with narrower limits
# (z -130..110 mm, joint1 -48..110 deg). Measure your own cell (vials,
# balance, stirrer) and tighten these before any real run.

workspace:
  x_min: -300.0
  x_max: 300.0
  y_min: -300.0
  y_max: 300.0
  z_min: -130.0
  z_max: 150.0
  joint1_min: -135.0
  joint1_max: 135.0
